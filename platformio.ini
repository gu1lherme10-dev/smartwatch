[env:lilygo_twatch]
platform = espressif32
board = ttgo-t-watch
framework = arduino
monitor_speed = 115200
lib_deps = 
    null0/TTGO TWatch Library V8@^1.4.2
    arduino-libraries/ArduinoBLE@^1.3.7
build_flags = 
  -I include
lib_ldf_mode = deep+

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
    arduino-libraries/ArduinoBLE@^1.3.7

